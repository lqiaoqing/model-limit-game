<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e12" />
    <link rel="icon" href="data:," />
    <title>Neon Siege Arena</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Neon Siege Arena game canvas"></canvas>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="ult-flash" class="hidden" aria-hidden="true"></div>
      <button id="lang-toggle" type="button" data-i18n="lang.toggle" title="切换语言 / Switch language">EN</button>

      <section id="hud" aria-live="polite">
        <!-- Top-left: survival stack (no boxed cards — combat frames) -->
        <div class="hud-frame survival">
          <div class="meter-row" data-meter="hull">
            <svg class="meter-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12h16M12 4v16" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/>
              <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <div class="meter-body">
              <div class="meter-meta"><span data-i18n="label.hull">装甲</span><span id="hp-text" class="tabular">100</span></div>
              <div class="meter-track"><div id="hp-fill" class="meter-fill hp"></div></div>
            </div>
          </div>
          <div class="meter-row" data-meter="shield">
            <svg class="meter-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z" fill="none" stroke="currentColor" stroke-width="1.7"/>
            </svg>
            <div class="meter-body">
              <div class="meter-meta"><span data-i18n="label.shield">护盾</span><span id="shield-text" class="tabular">50</span></div>
              <div class="meter-track"><div id="shield-fill" class="meter-fill shield"></div></div>
            </div>
          </div>
          <div class="meter-row" data-meter="heat">
            <svg class="meter-icon heat-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3c2 4 1 6 1 8a5 5 0 11-10 0c0-3 3-6 5-9 1 2 2 4 4 6z" fill="none" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <div class="meter-body">
              <div class="meter-meta"><span data-i18n="label.heat">热量</span><span id="heat-text" class="tabular">0%</span></div>
              <div class="meter-track heat-track"><div id="heat-fill" class="meter-fill heat"></div><div class="heat-danger"></div></div>
            </div>
          </div>
        </div>

        <!-- Top-center: mission strip -->
        <div class="hud-frame mission">
          <div class="mission-item">
            <span class="mission-label" data-i18n="label.wave">波次</span>
            <strong id="wave-value" class="tabular">1</strong>
          </div>
          <div class="mission-divider"></div>
          <div class="mission-item">
            <span class="mission-label" data-i18n="label.time">时间</span>
            <strong id="timer-value" class="tabular">00:00</strong>
          </div>
          <div class="mission-divider"></div>
          <div class="mission-item">
            <span class="mission-label" data-i18n="label.score">分数</span>
            <strong id="score-value" class="tabular">0</strong>
          </div>
          <div id="stress-badge" class="hidden">STRESS</div>
        </div>

        <!-- Weapon chips -->
        <div id="weapon-bar" class="weapon-bar" aria-label="Weapon select">
          <button type="button" class="weapon-chip" data-weapon="plasma" title="等离子连发 — 1">
            <span class="weapon-key">1</span>
            <span class="weapon-short" data-i18n="weapon.plasma">等离子</span>
          </button>
          <button type="button" class="weapon-chip" data-weapon="rail" title="轨道炮 — 2">
            <span class="weapon-key">2</span>
            <span class="weapon-short" data-i18n="weapon.rail">轨道</span>
          </button>
          <button type="button" class="weapon-chip" data-weapon="scatter" title="霰弹枪 — 3">
            <span class="weapon-key">3</span>
            <span class="weapon-short" data-i18n="weapon.scatter">霰弹</span>
          </button>
          <button type="button" class="weapon-chip" data-weapon="launcher" title="离子发射器 — 4">
            <span class="weapon-key">4</span>
            <span class="weapon-short" data-i18n="weapon.launcher">离子</span>
          </button>
        </div>

        <!-- Top-right: combat feedback cluster -->
        <div class="hud-frame combat">
          <div id="combo-block" class="combo-readout">
            <span class="combo-label" data-i18n="label.combo">连击</span>
            <strong id="combo-value" class="tabular">×1.0</strong>
            <div class="combo-pips" id="combo-pips" aria-hidden="true"></div>
          </div>
          <div class="ult-readout" id="ult-readout">
            <svg class="ult-ring" viewBox="0 0 48 48" aria-hidden="true">
              <circle class="ult-ring-bg" cx="24" cy="24" r="18"/>
              <circle id="ult-ring-fill" class="ult-ring-fill" cx="24" cy="24" r="18"/>
            </svg>
            <span class="ult-key">Q</span>
            <span class="ult-label" data-i18n="label.ult">大招</span>
            <div id="ult-fill" class="sr-only"></div>
          </div>
          <div class="foes-readout">
            <svg class="foes-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 18l4-10 4 6 4-8 4 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="label.foes">敌军</span>
            <strong id="enemies-value" class="tabular">0</strong>
          </div>
        </div>

        <div id="status-line">Eliminate the siege</div>
        <div id="boss-bar" class="hidden">
          <span id="boss-name">SIEGE CORE</span>
          <div class="boss-track"><div id="boss-fill" class="boss-fill"></div></div>
        </div>
        <div id="overheat-banner" class="hidden">OVERHEATED</div>
        <div id="wave-banner" class="hidden">WAVE 1</div>
        <div id="kill-feed" aria-hidden="true"></div>
      </section>

      <div id="perf-hud" class="hidden">
        <div>FPS <strong id="perf-fps">--</strong></div>
        <div>Calls <strong id="perf-calls">--</strong></div>
        <div>Tris <strong id="perf-tris">--</strong></div>
        <div>Foes <strong id="perf-foes">--</strong></div>
      </div>

      <div id="touch-controls" aria-hidden="true">
        <div id="touch-stick">
          <div id="touch-knob"></div>
        </div>
        <div class="touch-actions">
          <button id="ult-button" type="button">ULT</button>
          <button id="dash-button" type="button">DASH</button>
        </div>
      </div>

      <div id="overlay" class="hidden">
        <div class="panel">
          <h1 id="overlay-title">已暂停</h1>
          <p id="overlay-sub">霓虹攻城竞技场</p>
          <div id="overlay-stats" class="stats"></div>
          <div class="toggles">
            <label class="toggle">
              <input id="stress-toggle" type="checkbox" />
              <span data-i18n="toggle.stress">极限压力（敌潮拉满）</span>
            </label>
            <label class="toggle">
              <input id="gfx-toggle" type="checkbox" />
              <span data-i18n="toggle.graphics">低画质</span>
            </label>
            <label class="toggle">
              <button id="lang-toggle-overlay" type="button" data-i18n="lang.toggle">EN</button>
              <span data-i18n="toggle.lang">语言</span>
            </label>
          </div>
          <div class="overlay-actions">
            <button id="overlay-primary" type="button">继续</button>
            <button id="overlay-secondary" type="button">重开</button>
          </div>
          <p class="hint" data-i18n="overlay.hint">WASD 移动 · 鼠标瞄准 · 按住射击 · Shift 冲刺 · Q 大招 · P 暂停 · R 重开</p>
        </div>
      </div>

      <div id="upgrade-panel" class="hidden" role="dialog" aria-label="Choose upgrade">
        <div class="upgrade-shell">
          <div class="upgrade-header">
            <span class="upgrade-kicker" data-i18n="upgrade.kicker">波次清除</span>
            <h2 id="upgrade-title">选择改装</h2>
            <p id="upgrade-sub" data-i18n="upgrade.sub">选择一个模块 · 按 1 / 2 / 3</p>
          </div>
          <div id="upgrade-cards" class="upgrade-cards"></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
